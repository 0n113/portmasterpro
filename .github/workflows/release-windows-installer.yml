name: Release Windows Installer

# Builds the Windows x64 NSIS installer from Linux (cross-build, see BUILDING.md §7b)
# and attaches it together with the core binaries to an existing GitHub release.
#
# Triggers:
#   - push of a tag v*  : creates the GitHub release (pre-release when the tag contains a '-',
#                         e.g. v0.1.0-rc1) with notes from CHANGELOG.md and attaches the assets.
#   - workflow_dispatch : attaches the assets to an existing release/draft for the given tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the assets to (e.g. v0.1.0-rc1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: "2.2.7"
  RUST_TARGET: x86_64-pc-windows-gnu

jobs:
  windows-installer:
    name: Cross-build Windows installer and upload release assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in v[0-9]*) ;; *) echo "::error::tag must look like vX.Y.Z[-pre]"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/angular/package-lock.json

      - name: Install NSIS and MinGW cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis mingw-w64 lld llvm zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri -> target
          key: ${{ env.RUST_TARGET }}

      - name: Install tauri-cli (prebuilt)
        run: |
          curl -sSfL -o /tmp/tauri-cli.tgz \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          tar xzf /tmp/tauri-cli.tgz -C /tmp
          install -m 0755 /tmp/cargo-tauri "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri -V

      - name: Build Angular UI and asset bundles
        working-directory: desktop/angular
        run: |
          npm ci --no-audit --no-fund
          npm run build
          NODE_ENV=production npx ng build --configuration production tauri-builtin
          mkdir -p ../../dist/binary/all
          (cd dist && zip -qr ../../../dist/binary/all/portmaster.zip ./ -x "tauri-builtin/*")
          (cd ../../assets/data && zip -qr -9 -X ../../dist/binary/all/assets.zip *)
          # Guard: production bundle must not call account endpoints.
          ! grep -lE 'v1/spn/account|v1/account/features' dist/*.js

      - name: Build portmaster-core (windows/amd64, linux/amd64) and updatemgr
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          BT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDF="-X github.com/safing/portmaster/base/info.version=${VERSION} -X github.com/safing/portmaster/base/info.buildSource=${SHA} -X github.com/safing/portmaster/base/info.buildTime=${BT}"
          mkdir -p dist/binary/windows_amd64 dist/binary/linux_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDF" -o dist/binary/windows_amd64/portmaster-core.exe ./cmds/portmaster-core
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$LDF" -o dist/binary/linux_amd64/portmaster-core ./cmds/portmaster-core
          CGO_ENABLED=0 go build -trimpath -o /tmp/updatemgr ./cmds/updatemgr
          dist/binary/linux_amd64/portmaster-core version

      - name: Fetch signed kernel driver, core DLL and intel data (upstream stable)
        run: |
          mkdir -p dist/downloaded/windows_amd64 dist/intel
          /tmp/updatemgr download https://updates.safing.io/stable.v3.json --platform windows_amd64 dist/downloaded/windows_amd64
          find dist/downloaded/windows_amd64 -type f ! -name "portmaster-kext.sys" ! -name "portmaster-core.dll" -delete
          /tmp/updatemgr download https://updates.safing.io/intel.v3.json dist/intel
          ls -la dist/downloaded/windows_amd64 dist/intel

      - name: Cross-build Tauri UI (portmaster.exe)
        working-directory: desktop/tauri/src-tauri
        run: cargo tauri build --ci --target ${{ env.RUST_TARGET }} --no-bundle

      - name: Assemble installer inputs and build NSIS installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          T=desktop/tauri/src-tauri
          rm -rf "$T/binary" "$T/intel" && mkdir -p "$T/binary" "$T/intel"
          cp dist/downloaded/windows_amd64/portmaster-kext.sys dist/downloaded/windows_amd64/portmaster-core.dll \
             dist/binary/windows_amd64/portmaster-core.exe dist/binary/all/portmaster.zip dist/binary/all/assets.zip \
             "$T/target/${RUST_TARGET}/release/WebView2Loader.dll" "$T/binary/"
          cp dist/intel/* "$T/intel/"
          python3 packaging/windows/render_nsis_linux.py "$VERSION"

      - name: Collect assets and checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p release
          cp "dist/windows_amd64/portmasterpro_${VERSION}_x64-setup.exe" release/
          cp dist/binary/windows_amd64/portmaster-core.exe "release/portmaster-core_${VERSION}_windows_amd64.exe"
          cp dist/binary/linux_amd64/portmaster-core "release/portmaster-core_${VERSION}_linux_amd64"
          cp dist/binary/all/portmaster.zip "release/portmaster-ui_${VERSION}.zip"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: portmasterpro-${{ steps.ver.outputs.version }}-windows
          path: release/
          retention-days: 14

      - name: Create the GitHub release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, only uploading assets"; exit 0
          fi
          # Release notes: the CHANGELOG section for this version, or a short fallback.
          python3 - "$VERSION" > /tmp/notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""
          m = re.search(r"^## \[?" + re.escape(v) + r"\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else f"portmasterpro {v}. See BUILDING.md and desktop/CHANGES.md."
          print(body)
          PY
          ARGS=(--repo "$GITHUB_REPOSITORY" --title "portmasterpro $VERSION" --notes-file /tmp/notes.md --verify-tag)
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}"

      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" release/* --clobber --repo "${{ github.repository }}"
